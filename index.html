<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✦ AI Prompt Generator</h1>
            <p>Turn simple ideas into structured prompts.</p>
        </header>

        <main>
            <div class="input-group">
                <label for="idea">What do you want to create?</label>
                <textarea id="idea" placeholder="e.g., A girl standing in a forest..." rows="3"></textarea>
            </div>

            <!-- START OF BUILDER DROPDOWNS -->
            <div class="builder-grid">
               <div class="input-group">
                   <label for="format">Output Format</label>
                   <select id="format">
                       <option value="Normal">Normal Text Prompt</option>
                       <option value="JSON">Structured JSON Prompt</option>
                   </select>
               </div>

                <div class="input-group">
                    <label for="style">Style</label>
                    <select id="style">
                        <option value="surprise">🎲 Surprise Me</option>
                        <option value="photorealistic, highly detailed">Photorealistic</option>
                        <option value="cinematic, dramatic, movie still">Cinematic</option>
                        <option value="traditional portrait illustration, cultural attire, elegant fabric details">Traditional Portrait Illustration</option>
                        <option value="south indian cinematic poster design, moody aesthetic">South Indian Cinematic Poster</option>
                        <option value="cyberpunk, neon-lit, futuristic">Cyberpunk</option>
                        <option value="anime style, Studio Ghibli">Anime / Ghibli</option>
                        <option value="oil painting, renaissance style, classic">Oil Painting</option>
                        <option value="3D render, Unreal Engine 5, octane render">3D Render (Unreal Engine)</option>
                        <option value="watercolor, soft pastel colors, dreamy">Dreamy Watercolor</option>
                        <option value="minimalist, vector art, flat colors">Minimalist Vector</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="lighting">Lighting</label>
                    <select id="lighting">
                        <option value="surprise">🎲 Surprise Me</option>
                        <option value="golden hour lighting, warm glow, sun kissed">Golden Hour</option>
                        <option value="moody lighting, high contrast, chiaroscuro">Moody & Dark</option>
                        <option value="studio lighting, softbox, professional portrait setup">Soft Studio Portrait</option>
                        <option value="volumetric lighting, god rays, cinematic haze">Volumetric (God Rays)</option>
                        <option value="bioluminescent glow, vibrant neon reflections">Bioluminescent</option>
                        <option value="natural daylight, overcast soft shadows">Natural Overcast</option>
                        <option value="cinematic neon lighting, vivid pink and teal">Neon Pink & Teal</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="camera">Camera</label>
                    <select id="camera">
                        <option value="surprise">🎲 Surprise Me</option>
                        <option value="shot on 35mm lens, wide angle">Wide Angle (35mm)</option>
                        <option value="shot on 85mm portrait lens, shallow depth of field, creamy bokeh">Portrait Lens (85mm)</option>
                        <option value="macro photography, extreme close up, fine details">Macro (Close-up)</option>
                        <option value="drone shot, aerial view, birds eye">Aerial / Drone</option>
                        <option value="fisheye lens, distorted perspective, ultra wide">Fisheye Lens</option>
                        <option value="low angle shot, looking up, imposing perspective">Low Angle (Hero Shot)</option>
                        <option value="fashion editorial framing, medium shot">Fashion Editorial Framing</option>
                    </select>
                </div>
            </div>
            <!-- END OF BUILDER DROPDOWNS -->


            <button id="generate-btn">✨ Generate Prompt</button>

            <div class="output-section">
                <label>Generated Prompt</label>
                <div id="output-box" class="output-box">Your generated prompt will appear here...</div>
                <button id="copy-btn">📋 Copy</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
