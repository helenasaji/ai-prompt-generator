<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✦ AI Prompt Generator</h1>
            <p>Turn simple ideas into structured prompts.</p>
        </header>

        <main>
            <div class="input-group">
                <label for="idea">What do you want to create?</label>
                <textarea id="idea" placeholder="e.g., A girl standing in Kerala mountains..." rows="3"></textarea>
            </div>

            <!-- START OF BUILDER DROPDOWNS -->
            <div class="builder-grid">
                <div class="input-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="image">🖼️ Image Generation</option>
                        <option value="coding">💻 Coding</option>
                        <option value="writing">✍️ Writing</option>
                        <option value="json">{} JSON Data</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="style">Style</label>
                    <select id="style">
                        <option value="surprise">🎲 Surprise Me</option>
                        <option value="photorealistic, highly detailed">Photorealistic</option>
                        <option value="cinematic, dramatic, movie still">Cinematic</option>
                        <option value="cyberpunk, neon-lit, futuristic">Cyberpunk</option>
                        <option value="anime style, Studio Ghibli">Anime / Ghibli</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="lighting">Lighting</label>
                    <select id="lighting">
                        <option value="surprise">🎲 Surprise Me</option>
                        <option value="golden hour lighting, warm glow">Golden Hour</option>
                        <option value="moody lighting, high contrast">Moody & Dark</option>
                        <option value="studio lighting, softbox">Studio Lighting</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="camera">Camera</label>
                    <select id="camera">
                        <option value="surprise">🎲 Surprise Me</option>
                        <option value="shot on 35mm lens, wide angle">Wide Angle (35mm)</option>
                        <option value="macro photography, shallow depth of field">Macro (Close-up)</option>
                        <option value="drone shot, aerial view">Aerial / Drone</option>
                    </select>
                </div>
            </div>
            <!-- END OF BUILDER DROPDOWNS -->

            <button id="generate-btn">✨ Generate Prompt</button>

            <div class="output-section">
                <label>Generated Prompt</label>
                <div id="output-box" class="output-box">Your generated prompt will appear here...</div>
                <button id="copy-btn">📋 Copy</button>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
